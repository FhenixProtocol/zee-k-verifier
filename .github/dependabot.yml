# open-pull-requests-limit: 0 disables version-update PRs; Dependabot security
# updates (enabled in repo settings) still open PRs and are not limited by it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /tdx-signer
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /zk-verifier
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /rust-common
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

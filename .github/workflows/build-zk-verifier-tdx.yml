name: Build zk-verifier TDX image

# IMPORTANT: gated by GitHub Actions Workload Identity Federation in the shared
# fhenix-artifacts-registry project. Its WIF provider pins this workflow's
# `job_workflow_ref` (path + ref). Renaming this file or running it from a branch
# outside the pin breaks the WIF binding until the pin is updated.
#
# Builds ONCE and pushes to the shared Artifact Registry. Every environment's
# VM pulls the same digest from the artifact registry; each partner pins that
# digest in its attested-reader policy. CI auth uses three NON-SECRET repo
# variables — WIF_PROVIDER, PUBLISHER_SA, IMAGE_REGISTRY — pointing at
# fhenix-artifacts-registry. No static service-account keys.
#
# BUILDING IS NOT DEPLOYING: keys are only released to the digest the partners
# pinned (partner re-apply with the new digest).
#
# The build signs the pushed digest with keyless Cosign. It also attests SLSA
# build provenance. Both use this workflow's OIDC token. Both go to the public
# Rekor log. No signing key exists. A partner checks the signature at PIN time,
# before it approves a digest. The runtime gate does not change: each partner's
# CEL still pins the digest only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: main-<sha>)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "tdx-signer/**"
      - "zk-verifier/**"
      - "rust-common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-zk-verifier-tdx.yml"

# Confidential Space VMs are linux/amd64 only — no multi-arch matrix.
permissions:
  contents: read
  id-token: write     # OIDC → GCP WIF, and Fulcio for keyless Cosign
  attestations: write # SLSA build provenance

env:
  PLATFORM: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth-wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
          # Match the provider's allowed_audiences (GCP "no-scheme" URI form).
          audience: //iam.googleapis.com/${{ vars.WIF_PROVIDER }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.IMAGE_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth-wif.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-main-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        env:
          # Google Artifact Registry's Docker v2 API doesn't reliably support
          # HEAD requests against a manifest that was just created, which is
          # what buildx uses to attach the default SBOM/provenance attestation
          # index — that HEAD comes back "400 Bad Request" and fails the push.
          # `provenance: false` alone doesn't suppress this on current buildx;
          # the env var is required to fully disable default attestations.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          context: .
          file: tdx-signer/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable buildx's own provenance/SBOM attestations. The SLSA
          # attestation step below is the one that counts.
          provenance: false
          sbom: false

      # These two actions are pinned by SHA, unlike the rest of this file. A
      # moved tag on either one forges provenance for every image we ship.
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Cosign gets a certificate from Fulcio with this job's OIDC token. The
      # certificate names the repo, the workflow, the ref and the commit. The
      # partner asserts those four fields at pin time.
      #
      # The build makes one platform. Thus this digest is the amd64 platform
      # digest. The signature, the attestation and the partner pin all name it.
      #
      # Cosign stores the signature next to the image, under the tag
      # sha256-<digest>.sig. This registry grants allUsers the reader role, so a
      # partner reads that signature with no credential. That public read is
      # DELIBERATE and the partner check depends on it. Do not remove it.
      - name: Sign the image with keyless Cosign
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}@${DIGEST}"

      # The same identity attests the same digest in the standard SLSA format.
      # The partner verify command reads the Cosign signature above. This
      # attestation serves any other consumer.
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ vars.IMAGE_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarize
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          # workflow_ref is "<owner>/<repo>/<path>@<ref>". Add the server URL and
          # it equals the Fulcio certificate identity.
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          {
            echo "## Image built (shared artifact registry)"
            echo
            echo "**Tag:** \`${TAG}\`"
            echo
            echo "**Digest:**"
            echo
            echo '```'
            echo "${DIGEST}"
            echo '```'
            echo
            echo "**Full reference:**"
            echo
            echo '```'
            echo "${REGISTRY}@${DIGEST}"
            echo '```'
            echo
            echo "### Hand these two values to each partner"
            echo
            echo '```hcl'
            echo "image_digest = \"${DIGEST}\""
            echo "source_sha   = \"${COMMIT}\""
            echo '```'
            echo
            echo "Each partner re-applies its attested-reader policy with this digest."
            echo "That is the whole handoff. The partner tooling holds the rest"
            echo "as fixed constants."
            echo
            echo "### Verify this image against the public Rekor log"
            echo
            echo "The partner runs this on their own machine. It proves that this"
            echo "workflow built this digest from this commit. A non-zero exit means:"
            echo "do not pin."
            echo
            echo '```'
            echo "cosign verify ${REGISTRY}@${DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity ${IDENTITY} \\"
            echo "  --certificate-github-workflow-repository ${REPO} \\"
            echo "  --certificate-github-workflow-ref ${REF} \\"
            echo "  --certificate-github-workflow-sha ${COMMIT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

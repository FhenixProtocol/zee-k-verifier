name: Build zk-verifier TDX image

# IMPORTANT: gated by GitHub Actions Workload Identity Federation in the shared
# fhenix-artifacts-registry project. Its WIF provider pins this workflow's
# `job_workflow_ref` (path + ref). Renaming this file or running it from a branch
# outside the pin breaks the WIF binding until the pin is updated.
#
# Builds ONCE and pushes to the shared Artifact Registry. Every environment's
# VM pulls the same digest from the artifact registry; each partner pins that
# digest in its attested-reader policy. CI auth uses three NON-SECRET repo
# variables — WIF_PROVIDER, PUBLISHER_SA, IMAGE_REGISTRY — pointing at
# fhenix-artifacts-registry. No static service-account keys.
#
# BUILDING IS NOT DEPLOYING: keys are only released to the digest the partners
# pinned (partner re-apply with the new digest).
#
# The build attests SLSA build provenance for the pushed digest, using this
# workflow's OIDC token and Fulcio. No signing key exists. The attestation goes
# to the public Rekor log, and GitHub serves it on a public API that needs no
# account. A partner checks provenance at PIN time, before it approves a digest.
# The runtime gate does not change: each partner's CEL still pins the digest only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: main-<sha>)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "tdx-signer/**"
      - "zk-verifier/**"
      - "rust-common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-zk-verifier-tdx.yml"

# Confidential Space VMs are linux/amd64 only — no multi-arch matrix.
permissions:
  contents: read
  id-token: write     # OIDC → GCP WIF, and Fulcio for the attestation
  attestations: write # SLSA build provenance

env:
  PLATFORM: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth-wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
          # Match the provider's allowed_audiences (GCP "no-scheme" URI form).
          audience: //iam.googleapis.com/${{ vars.WIF_PROVIDER }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.IMAGE_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth-wif.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-main-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        env:
          # Google Artifact Registry's Docker v2 API doesn't reliably support
          # HEAD requests against a manifest that was just created, which is
          # what buildx uses to attach the default SBOM/provenance attestation
          # index — that HEAD comes back "400 Bad Request" and fails the push.
          # `provenance: false` alone doesn't suppress this on current buildx;
          # the env var is required to fully disable default attestations.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          context: .
          file: tdx-signer/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable buildx's own provenance/SBOM attestations. The SLSA
          # attestation step below is the one that counts.
          provenance: false
          sbom: false

      # The certificate Fulcio issues names this repo, this workflow, the ref and
      # the commit. Those are the four fields the partner asserts at pin time.
      #
      # The build makes one platform. Thus this digest is the amd64 platform
      # digest. The attestation and the partner pin both name it.
      #
      # push-to-registry stays FALSE. GitHub serves the bundle on a public API
      # that needs no account, which is where the partner reads it. It also must
      # stay false here for the reason recorded on the build step above: a
      # registry push HEADs the manifest that was just created, and GAR answers
      # that with 400.
      #
      # This action is pinned by SHA. Other actions in this file are not; that is
      # a wider gap, not something this pin closes.
      - name: Attest SLSA build provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ vars.IMAGE_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      # always(), so a failure above never costs the operator the digest.
      - name: Summarize
        if: always() && steps.push.outputs.digest != ''
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
          # CONSTANTS, written out in full and deliberately NOT derived from this
          # run. A command that asserts whatever the run already was proves
          # nothing. These are the values the partner tooling bakes in.
          REPO: FhenixProtocol/zee-k-verifier
          SIGNER_WORKFLOW: FhenixProtocol/zee-k-verifier/.github/workflows/build-zk-verifier-tdx.yml
          REF: refs/heads/main
        run: |
          set -euo pipefail
          {
            echo "## Image built (shared artifact registry)"
            echo
            echo "**Tag:** \`${TAG}\`"
            echo
            echo "**Digest:**"
            echo
            echo '```'
            echo "${DIGEST}"
            echo '```'
            echo
            echo "**Full reference:**"
            echo
            echo '```'
            echo "${REGISTRY}@${DIGEST}"
            echo '```'
            echo
            echo "### Hand these two values to each partner"
            echo
            echo '```hcl'
            echo "image_digest = \"${DIGEST}\""
            echo "source_sha   = \"${COMMIT}\""
            echo '```'
            echo
            echo "Each partner re-applies its attested-reader policy with this digest."
            echo "That is the whole handoff. The partner tooling holds the rest"
            echo "as fixed constants."
            echo
            echo "### Verify this image"
            echo
            echo "Runs on any machine. It needs no Fhenix credential and no GitHub"
            echo "account. A non-zero exit means: do not pin."
            echo
            echo '```bash'
            echo "curl -sL https://api.github.com/repos/${REPO}/attestations/${DIGEST} \\"
            echo "  | jq '.attestations[0].bundle' > bundle.json"
            echo
            echo "gh attestation verify oci://${REGISTRY}@${DIGEST} \\"
            echo "  --bundle bundle.json \\"
            echo "  --repo ${REPO} \\"
            echo "  --signer-workflow ${SIGNER_WORKFLOW} \\"
            echo "  --source-ref ${REF} \\"
            echo "  --source-digest ${COMMIT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

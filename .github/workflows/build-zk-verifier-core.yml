name: build-zk-verifier-core

# Publishes the plain (non-TDX) verifier to ghcr so downstream stacks — cofhe's
# docker-compose and its CI — can pull it instead of needing a zee-k checkout to
# build one.
#
# This is the SAME `production` feature set that deploys. Nothing is mocked and
# nothing is compiled out: real TFHE artifacts and signer read from disk via
# `get_keys()`, the verified-inputs GCS client intact.
#
# Why a second image at all, when build-zk-verifier-tdx.yml already publishes
# one: that workflow builds `tdx-signer/Dockerfile` — the TDX *launcher*, whose
# boot path is attestation -> STS -> per-partner WIF -> bucket-sourced key
# material. Outside a Confidential Space VM it cannot start, and it never reads
# the on-disk keys a local stack mounts. This builds `zk-verifier/Dockerfile`,
# the plain server, which is exactly what runs when the launcher hands it
# KeyMaterial. Different Dockerfile, different entrypoint, same crate.
#
# It also lands in ghcr rather than the GCP Artifact Registry, because cofhe's CI
# authenticates to ghcr and Docker Hub only.
#
# NOT a mock build. The `mock-keys` feature generates a fresh CRS, ClientKey and
# random signer at boot and ignores key_config entirely, so a verifier built that
# way cannot verify inputs the stack encrypts with cofhe's keys.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "zk-verifier/**"
      - "rust-common/**"
      - ".github/workflows/build-zk-verifier-core.yml"

permissions:
  contents: read
  packages: write

env:
  # Hardcoded lowercase: ghcr rejects uppercase in a repository name, and
  # `github.repository` preserves the org's casing ("FhenixProtocol/...").
  IMAGE: ghcr.io/fhenixprotocol/zee-k-verifier-core

jobs:
  # One leg per architecture on its NATIVE runner — QEMU-emulating a tfhe build
  # takes hours. amd64 is what cofhe's CI runs; arm64 is what devs run on Apple
  # Silicon, and both need to work from the same tag.
  build:
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Platform pair
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push (${{ matrix.platform }}, by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zk-verifier/Dockerfile
          build-args: FEATURES=production
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped apart from the TDX workflow's cache: same feature set, but a
          # different Dockerfile/binary, so a shared scope would thrash both.
          cache-from: type=gha,scope=core-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${PLATFORM_PAIR}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: core-digests-${{ env.PLATFORM_PAIR }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest and tag it.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: core-digests-*-${{ github.run_id }}
          merge-multiple: true

      # Downstream stacks pin the sha tag; `latest` is for humans poking at it.
      - name: Create manifest + tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            $(for f in *; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools inspect "${IMAGE}:latest"
        env:
          IMAGE: ${{ env.IMAGE }}

# mainnet overlay (six key-share holders, threshold 3) — only the per-env difference from envs/base.toml.
# Verified-inputs output bucket; must match the `proofs_bucket` tfvar that grants
# the compute SA write (terraform/compute).
[storage]
bucket = "fhenix-mainnet-zee-k-inputs"

# Push metrics over OTLP (default off); the :9090 exposition is served either way.
[metrics]
push = true

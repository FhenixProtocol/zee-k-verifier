[package]
name = "zk-verifier"
version = "0.1.0"
edition = "2021"
default-run = "zk-verifier"
publish = false
license-file = "../LICENSE"

[lib]
name = "zk_verifier"
path = "src/lib.rs"

[[bin]]
name = "zk-verifier"
path = "src/main.rs"

[[bin]]
name = "verify-stored-ct"
path = "scripts/verify_stored_ct.rs"

[[bin]]
name = "derive-signer-pubkey"
path = "scripts/derive_signer_pubkey.rs"

# Local load generator for the /verifyBatch concurrency hardening. Mints
# valid TFHE proofs against a matched keyset and drives concurrent load, so the
# admission cap / CPU gate / runtime-starvation behaviour can be pressure-tested
# without a TDX deploy. Build with --no-default-features (storage compiled out).
[[bin]]
name = "stress-verify"
path = "scripts/stress_verify.rs"

# End-to-end smoke test + on-chain value generator for POST /verifyBatch.
[[bin]]
name = "smoke-verify-batch"
path = "scripts/smoke_verify_batch.rs"

[features]
default = ["production"]
mock = ["mock-signer", "mock-keys"]
mock-signer = []
mock-keys = []
store-cts = []
external-storage = []
production = ["store-cts", "external-storage"]
ci = ["store-cts"]

[dependencies]
# Versions are pinned to what the committed Cargo.lock resolves (builds run
# --locked). Deps whose locked version differs from tdx-signer's lock (which
# consumes this crate) use a plain full-triple version instead of `=`, because
# an exact pin would force tdx-signer's lock to unify to it.
tfhe = { version = "=1.5.1", features = ["zk-pok", "integer"] }
sha3 = "0.10.8"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.1", features = ["full"] }
axum = "=0.8.9"
hex = "=0.4.3"
thiserror = "=2.0.18"

# Shared utilities
rust-common = { path = "../rust-common", features = ["keygen", "signing", "safe-serde"] }
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", features = ["json", "blocking"] }
bincode = "=1.3.3"
tfhe-versionable = "=0.7.0"
tower-http = { version = "=0.6.8", features = ["cors"] }
config = "0.15.22"
http = "=1.4.0"
futures = "=0.3.32"
metrics = "0.24.3"
metrics-exporter-prometheus = "=0.17.2"
metrics-utils-macros = "=0.1.0"
# FanoutBuilder: one global recorder feeding both the exposition and the push.
metrics-util = "=0.20.1"
google-cloud-storage = "=1.12.0"
google-cloud-auth = "=1.10.0"
google-cloud-gax = "=1.10.0"
bytes = "=1.11.1"
async-trait = "=0.1.89"
blake3 = "1.8.4"
chrono = "=0.4.44"
strum = { version = "=0.27.2", features = ["derive"] }
clap = { version = "=4.6.1", features = ["derive"] }
rand = "=0.8.6"


# OTLP push pipeline (metrics.push = true). The 0.31 line matches the
# opentelemetry graph google-cloud-* already resolves; http-proto only, and the
# exporter always receives our own client, so no reqwest feature is pulled.
#
# We keep 0.31 on purpose. A move to 0.32 removes metrics-exporter-otel.
# That crate uses 0.31. Its `Meter` type does not match a 0.32 provider.
# No bridge crate on crates.io supports 0.32 yet. Thus a move to 0.32 puts
# a copy of the bridge in this repo.
# The 0.32.1 release repairs baggage parsing. That fix does not apply here.
# This crate does not install a propagator. It does not read baggage.
# The code compiles, but nothing calls it.
# Move to 0.32 when a bridge supports it.
opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["metrics", "internal-logs"] }
opentelemetry-otlp = { version = "=0.31.0", default-features = false, features = ["http-proto", "internal-logs"] }
opentelemetry-http = { version = "=0.31.0", default-features = false }
# Message types for the export splitter — chunks of at most 200 points, the
# Telemetry API's hard per-request cap. On 0.31 gen-tonic-messages also pulls
# tonic (0.32 made it prost-only); accepted, tonic services stay unused.
opentelemetry-proto = { version = "=0.31.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "=0.14.1"
metrics-exporter-otel = "=0.3.1"

[dev-dependencies]
# The in-memory metric exporter (re-sample proof test) hides behind "testing".
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["metrics", "testing"] }
signature = "=2.2.0"
tower = "=0.5.3"
test-log = "=0.2.20"
